<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Constant scan: the table scan's picture, with the table dashed below its header because it is
       not stored anywhere - its rows are values written into the query.  Black is drawn in the
       symbol colour, red in the accent - see README.md. -->
  <!-- The header band, solid, the full width of the frame. -->
  <path d="M3 2.2h18a1.8 1.8 0 0 1 1.8 1.8v4.4H1.2V4A1.8 1.8 0 0 1 3 2.2z" fill="#000" stroke="none"/>
  <!-- The rest of the frame, dashed: a table made up on the spot. -->
  <path d="M2 8.4V20a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1V8.4" stroke-dasharray="2.2 1.8" stroke-linecap="butt"/>
  <!-- The scan, down through its rows. -->
  <path d="M12 10.5v7 M9 14.5l3 3 3-3" stroke="#F00" stroke-width="2"/>
</svg>
