<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Clustered index seek.  Black is drawn in the symbol colour, red in the accent - see README.md. -->
  <!-- The index: a root, the branches the seek did not take, and square leaf pages - the table's rows. -->
  <circle cx="12" cy="5" r="2" fill="#000" stroke="none"/>
  <path d="M12 10H6v4 M12 10v4"/>
  <rect x="4" y="15" width="4" height="4" rx="0.6" fill="#000" stroke="none"/>
  <rect x="10" y="15" width="4" height="4" rx="0.6" fill="#000" stroke="none"/>
  <!-- Square brackets round the leaf level: in a clustered index, it is the table. -->
  <path d="M3 14H1.5v6.5H3 M21 14h1.5v6.5H21"/>
  <!-- The seek: the one route from the root down to the page it wanted, and that page. -->
  <path d="M12 7v3h6v4 M16 12l2 2 2-2" stroke="#F00" stroke-width="2"/>
  <rect x="16" y="15" width="4" height="4" rx="0.6" fill="#F00" stroke="none"/>
</svg>
