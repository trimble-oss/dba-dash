<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Clustered index scan.  Black is drawn in the symbol colour, red in the accent - see README.md. -->
  <!-- The index: a root, its branches, and the leaf pages, square because they are the table's rows. -->
  <circle cx="12" cy="3.25" r="2" fill="#000" stroke="none"/>
  <path d="M12 5.25V7.5 M6 7.5h12 M6 7.5V10 M12 7.5V10 M18 7.5V10"/>
  <rect x="4" y="10.5" width="4" height="4" rx="0.6" fill="#000" stroke="none"/>
  <rect x="10" y="10.5" width="4" height="4" rx="0.6" fill="#000" stroke="none"/>
  <rect x="16" y="10.5" width="4" height="4" rx="0.6" fill="#000" stroke="none"/>
  <!-- Square brackets round the leaf level: in a clustered index, it is the table. -->
  <path d="M3 9.5H1.5V16H3 M21 9.5h1.5V16H21"/>
  <!-- The scan, along the whole leaf level. -->
  <path d="M2 20.5h18 M17.5 18l2.5 2.5-2.5 2.5" stroke="#F00" stroke-width="2"/>
</svg>
