<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Adaptive join: a decision put off until the query runs and the row count is known, between a
       hash join - its hash table, left - and nested loops, right.  Red is the decision; see README.md. -->
  <path d="M12 1.5l3.5 3.5-3.5 3.5L8.5 5z" fill="#F00" stroke="none"/>
  <path d="M9.8 7.6L6 11.5 M14.2 7.6l3.8 3.9" stroke="#F00" stroke-width="1.8"/>
  <!-- A hash table... -->
  <path d="M2.5 13.5h6v8.5h-6z M2.5 16.3h6 M2.5 19.1h6"/>
  <!-- ...or loops. -->
  <path d="M21.6 18a3.4 3.4 0 1 1-1-2.4 M20.9 13.2v2.6h-2.6"/>
</svg>
