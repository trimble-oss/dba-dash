<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <defs>
    <style>
      .canvas{fill: none; opacity: 0;}
      .trimble-blue{fill: #0063a3;}
      .trimble-grey{fill: #5b6670;}
      .white{fill: #ffffff;}
    </style>
  </defs>
  <title>IconLightRowHeaders</title>
  <g id="canvas" class="canvas">
    <path class="canvas" d="M16,16H0V0H16Z" />
  </g>
  <g id="level-1">
    <!--
      The 16 pixel form of Assets/RowHeaders.svg - RowHeaders_16x.png: a blue column of row headers
      down the left of a white body, each with a white mark for its number.

      Whole-pixel rectangles, as Grid_16x.svg.  Inside the 1 pixel grey frame are three 3 pixel rows
      split by 1 pixel grey lines that run through the header column as well, a 4 pixel header column,
      and two data columns.
    -->
    <rect class="trimble-grey" x="1" y="2" width="14" height="13" />
    <rect class="white" x="2" y="3" width="12" height="11" />
    <rect class="trimble-blue" x="2" y="3" width="4" height="11" />
    <rect class="trimble-grey" x="2" y="6" width="12" height="1" />
    <rect class="trimble-grey" x="2" y="10" width="12" height="1" />
    <rect class="trimble-grey" x="6" y="3" width="1" height="11" />
    <rect class="trimble-grey" x="10" y="3" width="1" height="11" />
    <rect class="white" x="3" y="4" width="2" height="1" />
    <rect class="white" x="3" y="8" width="2" height="1" />
    <rect class="white" x="3" y="12" width="2" height="1" />
  </g>
</svg>
