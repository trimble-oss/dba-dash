<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .canvas{fill: none; opacity: 0;}
      .trimble-blue{fill: #0063a3;}
      .white{fill: #ffffff;}
      .trimble-grey-stroke{fill: none; stroke: #5b6670; stroke-width: 4;}
    </style>
    <clipPath id="body">
      <rect x="4" y="6" width="56" height="52" rx="6" />
    </clipPath>
  </defs>
  <title>RowHeaders</title>
  <g id="canvas" class="canvas">
    <path class="canvas" d="M64,64H0V0H64Z" />
  </g>
  <g id="level-1">
    <!--
      Row headers: the counterpart of Grid.svg, with the blue on the column of row headers down the
      left rather than the header row across the top, and a white mark in each for its row number.
      Used for the grid's Row Headers menu (hide / show / show with row numbers).

      Same frame, colours and 4 wide strokes as Grid.svg.  Inside the outline the body is 48 by 44:
      three 12 high rows split by the two row lines, and a 12 wide header column then two data
      columns split by the column lines.  The row lines run through the header column too, so each
      header reads as a cell of its row.
    -->
    <g clip-path="url(#body)">
      <rect class="white" x="4" y="6" width="56" height="52" />
      <rect class="trimble-blue" x="4" y="6" width="18" height="52" />
      <path class="trimble-grey-stroke" d="M4,24H60M4,40H60M22,6V58M40,6V58" />
      <rect class="white" x="11" y="14" width="6" height="4" />
      <rect class="white" x="11" y="30" width="6" height="4" />
      <rect class="white" x="11" y="46" width="6" height="4" />
    </g>
    <rect class="trimble-grey-stroke" x="6" y="8" width="52" height="48" rx="4" />
  </g>
</svg>
