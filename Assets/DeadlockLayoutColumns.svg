<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <defs>
    <style>.canvas{fill: none; opacity: 0;}.light-lightblue{fill: #0077a0; opacity: 1;}.light-defaultgrey{fill: none; stroke: #212121; opacity: 1;}</style>
  </defs>
  <title>IconLightDeadlockLayoutColumns</title>
  <g id="canvas" class="canvas">
    <path class="canvas" d="M16,16H0V0H16Z" />
  </g>
  <g id="level-1">
    <!--
      Left to right in columns, the way the layered style reads: the waiting process, then what it
      is waiting on.  The connectors are what say "flow" rather than "grid" at this size.

      Strokes sit on half pixels and boxes on whole ones, so nothing lands astride a pixel boundary
      and comes out grey.
    -->
    <path class="light-defaultgrey" d="M5,8.5H7.5M7.5,2.5V13.5M7.5,2.5H11M7.5,13.5H11" stroke-width="1" />
    <rect class="light-lightblue" x="0" y="6" width="5" height="5" rx="1" />
    <rect class="light-lightblue" x="11" y="0" width="5" height="5" rx="1" />
    <rect class="light-lightblue" x="11" y="11" width="5" height="5" rx="1" />
  </g>
</svg>
