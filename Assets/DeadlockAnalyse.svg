<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <defs>
    <style>.canvas{fill: none; opacity: 0;}.light-lightblue{fill: #0077a0; opacity: 1;}.light-defaultgrey{fill: none; stroke: #212121; opacity: 1;}</style>
  </defs>
  <title>IconLightDeadlockAnalyse</title>
  <g id="canvas" class="canvas">
    <path class="canvas" d="M16,16H0V0H16Z" />
  </g>
  <g id="level-1">
    <!--
      Two sparkles - the shape that has come to mean "ask the model".  Nothing here is specific to
      deadlocks: the same button reads "Submit for analysis" or "Analyse again", so the picture has
      to say AI rather than say deadlock.

      Each sparkle is a straight-edged four point star: tips on the axes at radius r, waist at the
      diagonals at radius ri.  Curved arms and a waist pinched to the centre both thin out to a
      grey haze at 16 pixels, so the waist is kept fat - r 6.75 / ri 2.8 for the large one, r 3 /
      ri 1.2 for the small - and the arms run along the axes, where whole pixel rows can carry them.
    -->
    <path class="light-lightblue" d="M6.75,2.5 8.73,7.27 13.5,9.25 8.73,11.23 6.75,16 4.77,11.23 0,9.25 4.77,7.27Z" />
    <path class="light-lightblue" d="M13,0 13.85,2.15 16,3 13.85,3.85 13,6 12.15,3.85 10,3 12.15,2.15Z" />
  </g>
</svg>
